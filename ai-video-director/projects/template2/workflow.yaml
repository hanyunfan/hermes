# Negative-prompt merge (2026-10-17): the H3 node has only
# a single `prompt` port, no negative_prompt port.
# marker below tells the adapter to concatenate
# shot.prompt + shot.negative_prompt with the separator
# specified in merge_negative_separator, then write the
# merged string into the prompt node.
workflow_name: MiniMax_H3_reference_to_video
workflow_path: video_workflow_api_r2v.json
prompt_node: Prompt
negative_prompt_node: Prompt
seed_node: RandomNoise
output_node: Save Video
prompt_input_key: value
negative_prompt_input_key: value
seed_input_key: noise_seed
reference_image_nodes:
  ref_image_0: Load Image Ref
  ref_image_1: Load Image Ref 1
  ref_image_2: Load Image Ref 2
image_input_nodes: {}
extra_param_nodes:
  duration_sec: Float (duration)
  frame_count: Int (frame count)
extra_param_input_keys:
  duration_sec: value
  frame_count: value
duration_param: duration_sec
frame_count_param: frame_count
start_frame_role: start_frame
notes: "Uses video_workflow_api_r2v.json (exported API format from ComfyUI 0.37.0).\n\
  22 nodes total: 4 loaders (UNET/CLIP/VAE/LoRA) + 3 LoadImage ref slots +\nMiniMaxH3ReferenceToVideo\
  \ + standard sampler chain (RandomNoise,\nBasicGuider, SamplerCustomAdvanced) +\
  \ VAE decode (video + audio) +\nCreateVideo + SaveVideo.\n\nCharacter consistency\
  \ strategy:\n  Each character card's `reference_images` list can carry multiple\n\
  \  images with different `image_type` values. The runner auto-sorts:\n  face / expression\
  \ refs get the lowest slot indices (0, 1) where the\n  ref2v node reserves the strongest\
  \ signal, then front/hero/full get\n  the middle slots, then side/back/costume fill\
  \ the rest.\n"
reference_video_nodes:
  ref_video_0: Load Video Ref (previous shot)
merge_negative_into_prompt: true
merge_negative_separator: 'Do not: '
