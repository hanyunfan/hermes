# Workflow mapping for MiniMax-H3 reference-to-video (ref2v) workflow.
#
# This template uses the ComfyUI native `MiniMaxH3ReferenceToVideo` node
# (`comfy_extras/nodes_minimax_h3.py`) which accepts up to 9 reference
# images as conditioning. Each image is a separate LoadImage node wired
# into the ref2v node's `ref_images.ref_image_<i>` slot.
#
# Reference images are uploaded by the runner, sorted by image_type
# (face gets slot 0, then expression, front/hero/full, side/back/costume),
# and routed into the matching LoadImage node via the adapter.
#
# Models (all must exist under /home/frank/ComfyUI/models/):
#   diffusion_models/minimax_h3_ref2va_pruned_int8_convrot.safetensors
#   text_encoders/qwen3vl_32b_minimax_h3_nvfp4_awq.safetensors
#   vae/minimax_h3_video_vae_int8_convrot.safetensors
#   vae/minimax_h3_audio_vae_fp32.safetensors
#   loras/minimax_h3_ref2v_turbo_4step_v0.1_comfyui_bf16.safetensors  (optional)
#
# Workflow JSON files in this template:
#   - private/video_workflow_api_r2v.json   API format (used by framework)
#   - private/video_workflow_r2v_ui.json    UI format (open in ComfyUI frontend)

workflow_name: MiniMax_H3_reference_to_video
workflow_path: video_workflow_api_r2v.json

# Node titles — see private/video_workflow_api_r2v.json
# The "Prompt" node is a PrimitiveStringMultiline that the adapter
# patches with the shot's English prompt each generation.
prompt_node: "Prompt"
negative_prompt_node: "Prompt"   # ref2v node has no separate neg port
seed_node: "RandomNoise"          # noise seed widget
output_node: "Save Video"

# Input port names — overrides legacy "text" / "image" / "seed" defaults.
# PrimitiveStringMultiline uses `value` for the prompt string.
prompt_input_key: value
negative_prompt_input_key: value
seed_input_key: noise_seed

# Reference image routing (the new ref2v path).
# Each entry maps a slot_key (ref_image_0, ref_image_1, ...) to a LoadImage
# node title. The runner builds an ordered list of references (face gets
# ref_image_0, etc.) and the adapter routes each entry into the
# corresponding node's `image` input.
#
# If a slot's node doesn't exist in the workflow JSON (e.g. you trim the
# workflow to only 2 ref slots), the adapter stops routing at the first
# missing slot. So the minimum useful config is at least ref_image_0.
reference_image_nodes:
  ref_image_0: "Load Image Ref"

# Legacy single-image path is NOT used for ref2v; leave empty so the
# adapter doesn't try to wire `shot.start_frame` into a single LoadImage.
image_input_nodes: {}

# Extra params: duration auto-wires into the PrimitiveFloat node.
extra_param_nodes:
  duration_sec: "Float (duration)"

# PrimitiveFloat's input port is "value".
extra_param_input_keys:
  duration_sec: value
  frame_count: value

# Auto-wire shot.duration_sec into the duration_param node.
duration_param: duration_sec
# Auto-wire derived frame count (= 24 * duration_sec, snapped to a
# 17-multiple) into the ref2v node via the PrimitiveInt above.
frame_count_param: frame_count
start_frame_role: start_frame   # unused (no legacy single-image fallback)

notes: |
  Uses video_workflow_api_r2v.json (exported API format from ComfyUI 0.37.0).
  22 nodes total: 4 loaders (UNET/CLIP/VAE/LoRA) + 3 LoadImage ref slots +
  MiniMaxH3ReferenceToVideo + standard sampler chain (RandomNoise,
  BasicGuider, SamplerCustomAdvanced) + VAE decode (video + audio) +
  CreateVideo + SaveVideo.

  Character consistency strategy:
    Each character card's `reference_images` list can carry multiple
    images with different `image_type` values. The runner auto-sorts:
    face / expression refs get the lowest slot indices (0, 1) where the
    ref2v node reserves the strongest signal, then front/hero/full get
    the middle slots, then side/back/costume fill the rest.
