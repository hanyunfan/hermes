name: daily-tournament-fetch

on:
  schedule:
    # Run at 6am Central every day. Cron uses UTC.
    - cron: "0 12 * * *"
  workflow_dispatch:  # allow manual trigger

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install chromium
          playwright install-deps chromium

      - name: Run tournament fetch
        env:
          HOME_ZIP: 78750
          HOME_LAT: 30.5490
          HOME_LNG: -97.7805
          HOME_RADIUS_MILES: 80
        run: python scripts/fetch_tournaments.py

      - name: Validate output
        run: |
          python -c "
          import json, sys
          d = json.load(open('data/tournaments.json'))
          assert 'tournaments' in d, 'missing tournaments key'
          assert 'sources' in d, 'missing sources key'
          print(f'OK: {len(d[\"tournaments\"])} tournaments from sources:', {k: v['status'] for k, v in d['sources'].items()})
          "

      - name: Commit refreshed data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/tournaments.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "chore(data): refresh tournaments.json [skip ci]"
          git push