[project]
name = "rsync-tree"
version = "2.0.0"
description = "Event-driven parallel rsync tree across a cluster with Rich TUI"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Frank Han", email = "hanyunfan@example.com" }]
dependencies = [
    "rich>=13.0",
]

[project.scripts]
rsync-tree = "rsync_tree:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["rsync-tree"]
