name: Fetch matches

on:
  schedule:
    # 12:00 UTC = 07:00 CDT (morning refresh, before kickoff)
    - cron: "0 12 * * *"
    # 21:00 UTC = 16:00 / 17:00 CDT (afternoon refresh, catches evening games)
    - cron: "0 21 * * *"
    # 03:00 UTC = 22:00 CDT (final refresh, scores settled)
    - cron: "0 3 * * *"
  workflow_dispatch:
  push:
    paths:
      - "scripts/fetch_matches.py"
      - ".github/workflows/fetch-matches.yml"

permissions:
  contents: write

concurrency:
  group: fetch-wc2026
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch matches
        working-directory: world-cup-2026
        run: |
          python3 scripts/fetch_matches.py --tz America/Chicago --out data/matches.json
          echo "----"
          echo "First 40 lines of matches.json:"
          head -40 data/matches.json

      - name: Commit & push
        working-directory: world-cup-2026
        run: |
          if git diff --quiet data/matches.json; then
            echo "No changes to data/matches.json"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/matches.json
          git commit -m "ci: refresh matches $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push
