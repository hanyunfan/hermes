name: Fetch WC 2026 matches

on:
  # 12× daily, every 2h UTC. Compensates for GH Actions schedule
  # drift (observed 1-3h late, worse off-hours) by running often
  # enough that at least one run per match window lands close to
  # on time. Times in UTC; CDT = UTC-5 during the tournament.
  schedule:
    - cron: "0 0 * * *"   # 00:00 UTC = 19:00 CT (prev day)
    - cron: "0 2 * * *"   # 02:00 UTC = 21:00 CT (prev day)
    - cron: "0 4 * * *"   # 04:00 UTC = 23:00 CT (prev day)
    - cron: "0 6 * * *"   # 06:00 UTC = 01:00 CT
    - cron: "0 8 * * *"   # 08:00 UTC = 03:00 CT
    - cron: "0 10 * * *"  # 10:00 UTC = 05:00 CT
    - cron: "0 12 * * *"  # 12:00 UTC = 07:00 CT
    - cron: "0 14 * * *"  # 14:00 UTC = 09:00 CT
    - cron: "0 16 * * *"  # 16:00 UTC = 11:00 CT
    - cron: "0 18 * * *"  # 18:00 UTC = 13:00 CT
    - cron: "0 20 * * *"  # 20:00 UTC = 15:00 CT
    - cron: "0 22 * * *"  # 22:00 UTC = 17:00 CT
  workflow_dispatch:
  push:
    paths:
      - "world-cup-2026/scripts/fetch_matches.py"
      - ".github/workflows/fetch-wc2026.yml"

permissions:
  contents: write

concurrency:
  group: fetch-wc2026
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch matches
        working-directory: world-cup-2026
        run: |
          python3 scripts/fetch_matches.py --tz America/Chicago --out data/matches.json
          echo "----"
          echo "First 40 lines of matches.json:"
          head -40 data/matches.json

      - name: Commit & push
        working-directory: world-cup-2026
        env:
          TRIGGER: ${{ github.event_name }}
        run: |
          if git diff --quiet data/matches.json; then
            echo "No changes to data/matches.json"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/matches.json
          TS=$(date -u '+%Y-%m-%d %H:%M UTC')
          case "$TRIGGER" in
            schedule) SUFFIX=" (scheduled)" ;;
            push)     SUFFIX=" (push)" ;;
            *)        SUFFIX="" ;;
          esac
          git commit -m "ci: refresh matches ${TS}${SUFFIX}"
          git push
          # Ping pages.yml via repository_dispatch. GITHUB_TOKEN-pushed
          # commits can't trigger another workflow's `push:` event
          # (GH security policy), so we explicitly fire this event.
          # pages.yml listens for event_type=refresh-wc2026-data.
          curl -fsS -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/dispatches" \
            -d '{"event_type":"refresh-wc2026-data"}' \
            || echo "warn: dispatch failed (non-fatal; pages may lag)"
