name: Fetch WC 2026 matches

on:
  schedule:
    # Six runs per day, each ~30 min after a typical group-stage
    # match window ends (group stage matches kick off at 12/15/18/21 ET,
    # run ~2h 5m, so end ~14/17/20/23 ET; cron fires 30 min after).
    # Times shown in UTC; CDT = UTC-5 during the tournament.
    - cron: "0 12 * * *"   # 12:00 UTC = 07:00 CT — morning preview / settle overnight
    - cron: "30 18 * * *"  # 18:30 UTC = 13:30 CT — after ~13:00 CT matches
    - cron: "30 21 * * *"  # 21:30 UTC = 16:30 CT — after ~16:00 CT matches
    - cron: "30 0 * * *"   # 00:30 UTC = 19:30 CT — after ~19:00 CT matches
    - cron: "30 3 * * *"   # 03:30 UTC = 22:30 CT — after ~22:00 CT matches
    - cron: "0 6 * * *"    # 06:00 UTC = 01:00 CT — settle any extra-time / late games
  workflow_dispatch:
  push:
    paths:
      - "world-cup-2026/scripts/fetch_matches.py"
      - ".github/workflows/fetch-wc2026.yml"

permissions:
  contents: write

concurrency:
  group: fetch-wc2026
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch matches
        working-directory: world-cup-2026
        run: |
          python3 scripts/fetch_matches.py --tz America/Chicago --out data/matches.json
          echo "----"
          echo "First 40 lines of matches.json:"
          head -40 data/matches.json

      - name: Commit & push
        working-directory: world-cup-2026
        run: |
          if git diff --quiet data/matches.json; then
            echo "No changes to data/matches.json"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/matches.json
          git commit -m "ci: refresh matches $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push
