name: Fetch WC 2026 matches

on:
  # Match window: 11:00–04:00 CT (16:00–04:59 UTC). Refresh every
  # 20 min so live scores, half-time updates, lineups, and final
  # results land within a few minutes. Peak hours (14:00 + 20:00 CT,
  # ~12 matches each) get naturally dense coverage from the cadence.
  # Quiet hours: 04:00–11:00 CT (09:00–15:59 UTC). One daily refresh
  # at 04:00 CT to pick up any overnight standings / corrections.
  # Times in UTC; CDT = UTC-5 during the tournament. ~40 runs/day,
  # ~1200 GH Actions minutes / month, well under the 2000-min free
  # tier.
  schedule:
    - cron: "*/20 16-23 * * *"
    - cron: "*/20 0-4 * * *"
    - cron: "0 9 * * *"
  workflow_dispatch:
  push:
    paths:
      - "world-cup-2026/scripts/fetch_matches.py"
      - ".github/workflows/fetch-wc2026.yml"

permissions:
  contents: write

concurrency:
  group: fetch-wc2026
  # When GH Actions backs up and queues multiple runs, drop the older
  # ones in favor of the latest — the only thing that matters is
  # that matches.json reflects the most recent ESPN state.
  cancel-in-progress: true

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch matches
        working-directory: world-cup-2026
        run: |
          python3 scripts/fetch_matches.py --tz America/Chicago --out data/matches.json
          echo "----"
          echo "First 40 lines of matches.json:"
          head -40 data/matches.json

      - name: Commit & push
        working-directory: world-cup-2026
        env:
          TRIGGER: ${{ github.event_name }}
        run: |
          if git diff --quiet data/matches.json; then
            echo "No changes to data/matches.json"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/matches.json
          TS=$(date -u '+%Y-%m-%d %H:%M UTC')
          case "$TRIGGER" in
            schedule) SUFFIX=" (scheduled)" ;;
            push)     SUFFIX=" (push)" ;;
            *)        SUFFIX="" ;;
          esac
          git commit -m "ci: refresh matches ${TS}${SUFFIX}"
          git push
          # Ping pages.yml via repository_dispatch. GITHUB_TOKEN-pushed
          # commits can't trigger another workflow's `push:` event
          # (GH security policy), so we explicitly fire this event.
          # pages.yml listens for event_type=refresh-wc2026-data.
          curl -fsS -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/dispatches" \
            -d '{"event_type":"refresh-wc2026-data"}' \
            || echo "warn: dispatch failed (non-fatal; pages may lag)"
