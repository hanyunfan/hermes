name: Fetch WC 2026 matches

on:
  # Match window: 11:00–04:00 CT (16:00–04:59 UTC). Refresh every
  # 30 min so live scores, half-time updates, lineups, and final
  # results land within a few minutes. Peak hours (14:00 + 20:00 CT,
  # ~12 matches each) get naturally dense coverage from the cadence.
  # Cold window: 04:00–11:00 CT (09:00–15:59 UTC). No scheduled
  # refreshes — no matches are on during this stretch, and any
  # late-breaking schedule change is picked up on the next day's
  # first match-window run.
  # Times in UTC; CDT = UTC-5 during the tournament. ~26 runs/day,
  # comfortably under the 2000-min free tier.
  # schedule DISABLED 2026-08-20 — WC 2026 tournament ended; no live data to refresh.
  # Re-enable for the 2030 tournament by uncommenting the next 3 lines.
  # schedule:
  #   - cron: "*/30 16-23 * * *"
  #   - cron: "*/30 0-4 * * *"
  workflow_dispatch:
  push:
    paths:
      - "world-cup-2026/scripts/fetch_matches.py"
      - "world-cup-2026/scripts/build_weekly_picks.py"
      - "world-cup-2026/scripts/compute_knockout_odds.py"
      - ".github/workflows/fetch-wc2026.yml"

permissions:
  contents: write

concurrency:
  group: fetch-wc2026
  # When GH Actions backs up and queues multiple runs, drop the older
  # ones in favor of the latest — the only thing that matters is
  # that matches.json reflects the most recent ESPN state.
  cancel-in-progress: true

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch matches
        working-directory: world-cup-2026
        run: |
          python3 scripts/fetch_matches.py --tz America/Chicago --out data/matches.json
          echo "----"
          echo "First 40 lines of matches.json:"
          head -40 data/matches.json

      - name: Build weekly-picks skeleton
        working-directory: world-cup-2026
        # Refreshes the auto fields (group-stage stakes, score) every
        # cycle. Manual subjective fields (headline, watch_for, etc.)
        # are preserved across runs by the script itself; only the
        # date rollover wipes them. The script is a no-op when the
        # today's match list is empty (e.g. cold window).
        run: |
          if [ ! -f data/weekly-picks.json ]; then
            python3 scripts/build_weekly_picks.py --tz America/Chicago
            echo "First run: wrote fresh weekly-picks.json"
          else
            python3 scripts/build_weekly_picks.py --tz America/Chicago
            echo "Refreshed weekly-picks.json (manual fields preserved)"
          fi

      - name: Compute knockout odds
        working-directory: world-cup-2026
        # Monte Carlo per-group position probabilities for the
        # Knockout Odds tab. 10K sims is fast (~1s) and well within
        # the 5-min job budget. Skipped on the trigger runs that
        # don't need fresh odds (e.g. cold windows with no group
        # matches pending); we always run it for now since the cost
        # is negligible.
        run: |
          python3 scripts/compute_knockout_odds.py --sims 10000 --tz America/Chicago

      - name: Commit & push
        working-directory: world-cup-2026
        env:
          TRIGGER: ${{ github.event_name }}
        run: |
          if git diff --quiet data/matches.json data/weekly-picks.json data/knockout-odds.json; then
            echo "No changes to data/"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/matches.json data/weekly-picks.json data/knockout-odds.json
          TS=$(date -u '+%Y-%m-%d %H:%M UTC')
          case "$TRIGGER" in
            schedule) SUFFIX=" (scheduled)" ;;
            push)     SUFFIX=" (push)" ;;
            *)        SUFFIX="" ;;
          esac
          git commit -m "ci: refresh data ${TS}${SUFFIX}"
          git push
          # Ping pages.yml via repository_dispatch. GITHUB_TOKEN-pushed
          # commits can't trigger another workflow's `push:` event
          # (GH security policy), so we explicitly fire this event.
          # pages.yml listens for event_type=refresh-wc2026-data.
          curl -fsS -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/dispatches" \
            -d '{"event_type":"refresh-wc2026-data"}' \
            || echo "warn: dispatch failed (non-fatal; pages may lag)"
