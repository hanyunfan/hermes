name: Fetch WC 2026 matches

on:
  # Primary path: external cron (cron-job.org, see README) hits
  # /dispatches 6× per day in America/Chicago. External triggers
  # fire within seconds; GH Actions schedule is unreliable (1-3h
  # observed in practice, worse off-hours).
  repository_dispatch:
    types: [refresh-wc2026]
  # Fallback: 6× daily GH Actions cron. Covers the schedule even
  # if the external cron is down. Runs the same 6 CT windows.
  schedule:
    # Group-stage matches kick off 11/14/17/20/23 CT, run ~2h05,
    # so end ~13/16/19/22/01 CT. Cron fires 30 min after each
    # window ends to catch updated scores. Times in UTC
    # (CDT = UTC-5 during the tournament).
    - cron: "0 12 * * *"   # 12:00 UTC = 07:00 CT
    - cron: "30 18 * * *"  # 18:30 UTC = 13:30 CT
    - cron: "30 21 * * *"  # 21:30 UTC = 16:30 CT
    - cron: "30 0 * * *"   # 00:30 UTC = 19:30 CT
    - cron: "30 3 * * *"   # 03:30 UTC = 22:30 CT
    - cron: "0 6 * * *"    # 06:00 UTC = 01:00 CT
  workflow_dispatch:
  push:
    paths:
      - "world-cup-2026/scripts/fetch_matches.py"
      - ".github/workflows/fetch-wc2026.yml"

permissions:
  contents: write

concurrency:
  group: fetch-wc2026
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch matches
        working-directory: world-cup-2026
        run: |
          python3 scripts/fetch_matches.py --tz America/Chicago --out data/matches.json
          echo "----"
          echo "First 40 lines of matches.json:"
          head -40 data/matches.json

      - name: Commit & push
        working-directory: world-cup-2026
        env:
          TRIGGER: ${{ github.event_name }}
        run: |
          if git diff --quiet data/matches.json; then
            echo "No changes to data/matches.json"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/matches.json
          TS=$(date -u '+%Y-%m-%d %H:%M UTC')
          case "$TRIGGER" in
            repository_dispatch) SUFFIX=" (external)" ;;
            schedule)            SUFFIX=" (scheduled)" ;;
            push)                SUFFIX=" (push)" ;;
            *)                   SUFFIX="" ;;
          esac
          git commit -m "ci: refresh matches ${TS}${SUFFIX}"
          git push
