name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  # The fetch-wc2026 workflow can't trigger us via push (GH's GITHUB_TOKEN
  # security policy: events fired by GITHUB_TOKEN don't chain into other
  # workflows). So it pings this event_type after a successful data push,
  # and we re-deploy. Code pushes still go through the `push:` path above.
  repository_dispatch:
    types: [refresh-wc2026-data]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v4
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
