<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Who is AI — 人机鉴别群聊游戏</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- ═══════════════ SCREEN: LOBBY ═══════════════ -->
<div id="screen-lobby" class="screen lobby active">
  <h1>Who is AI</h1>
  <p class="subtitle">人机鉴别群聊游戏</p>

  <div class="cards">
    <!-- Create Room -->
    <div class="card">
      <h2>创建房间</h2>
      <div class="form-row">
        <label>对局模式</label>
        <div class="toggle-group">
          <label class="toggle-btn selected" id="mode-light-btn">
            <input type="radio" name="mode" value="light" checked> 4人轻量局
          </label>
          <label class="toggle-btn" id="mode-standard-btn">
            <input type="radio" name="mode" value="standard"> 9人标准局
          </label>
        </div>
      </div>
      <div class="form-row">
        <label>单轮聊天时长</label>
        <select id="cfg-chat-duration">
          <option value="300">5 分钟</option>
          <option value="480" selected>8 分钟</option>
          <option value="600">10 分钟</option>
        </select>
      </div>
      <div class="form-row">
        <label>房间权限</label>
        <select id="cfg-room-visibility">
          <option value="public">公开房间</option>
          <option value="private">加密私密房间</option>
        </select>
      </div>
      <div class="form-row" id="pwd-row" style="display:none;">
        <label>房间密码</label>
        <input type="text" id="cfg-password" placeholder="输入密码" maxlength="20">
      </div>
      <div class="form-row">
        <label>围观权限</label>
        <div style="display:flex;gap:12px;margin-top:4px;">
          <label class="check-row"><input type="checkbox" id="cfg-spectator-on" checked> 允许围观</label>
        </div>
      </div>
      <div class="form-row">
        <label>上帝视角（房主可见AI标注）</label>
        <div style="display:flex;gap:12px;margin-top:4px;">
          <label class="check-row"><input type="checkbox" id="cfg-god-view"> 开放上帝视角</label>
        </div>
      </div>
      <div class="form-row">
        <label>AI调用模式</label>
        <div style="display:flex;gap:12px;margin-top:4px;">
          <label class="check-row"><input type="checkbox" id="cfg-ai-independent"> 多AI独立调用不同模型</label>
        </div>
      </div>
      <button class="btn btn-primary" id="btn-create">创建房间</button>
    </div>

    <!-- Join Room -->
    <div class="card">
      <h2>加入房间</h2>
      <div class="form-row">
        <label>房间号</label>
        <input type="text" id="join-room-id" placeholder="输入6位房间号" maxlength="6" style="text-transform:uppercase;">
      </div>
      <div class="form-row">
        <label>密码（可不填）</label>
        <input type="text" id="join-password" placeholder="房间密码" maxlength="20">
      </div>
      <button class="btn btn-secondary" id="btn-join">加入房间</button>

      <div style="margin-top:24px; padding-top:16px; border-top:1px solid var(--border);">
        <h2 style="font-size:1rem;margin-bottom:12px;">公开房间列表</h2>
        <div id="public-rooms-list">
          <div class="waiting-hint" id="no-rooms">暂无公开房间</div>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- ═══════════════ SCREEN: WAITING ═══════════════ -->
<div id="screen-waiting" class="screen">
  <div class="room-header">
    <div>
      <div class="room-id" id="wait-room-id">------</div>
      <div class="room-meta">房间模式：<span id="wait-room-mode">--</span> · 等待玩家加入</div>
    </div>
    <div style="display:flex;gap:10px;align-items:center;">
      <button class="btn btn-secondary" id="btn-copy-room">复制房间号</button>
      <button class="btn btn-danger" id="btn-leave-room">离开房间</button>
    </div>
  </div>
  <div class="waiting-body">
    <div class="seat-grid" id="wait-seats"></div>
    <div class="waiting-hint" id="wait-hint">等待房主开始游戏...</div>
  </div>
</div>

<!-- ═══════════════ SCREEN: GAME ═══════════════ -->
<div id="screen-game" class="screen" style="padding:12px;gap:12px;">
  <!-- Top bar -->
  <div class="room-header">
    <div>
      <div class="room-id" id="game-room-id">------</div>
      <div class="room-meta" id="game-round-info">第 1 轮</div>
    </div>
    <div style="display:flex;align-items:center;gap:16px;">
      <span class="phase-badge phase-chatting" id="phase-badge">等待中</span>
      <div class="timer" id="timer-display">--:--</div>
      <button class="btn btn-danger" style="padding:8px 14px;" id="btn-quit-game">退出</button>
    </div>
  </div>

  <!-- Spectator badge -->
  <div id="spec-badge-area" style="display:none;padding:0 12px;">
    <span class="spec-badge">👁 围观模式 — 禁言禁投票</span>
  </div>

  <!-- Main layout -->
  <div class="game-layout">
    <!-- Chat panel -->
    <div class="chat-panel">
      <div class="chat-header">
        <span class="round-info" id="chat-round-label">第 1 轮 · 聊天中</span>
        <span class="timer" id="chat-timer">--:--</span>
      </div>
      <div class="chat-messages" id="chat-messages"></div>
      <div class="chat-input-area" id="chat-input-area">
        <input type="text" id="chat-input" placeholder="输入聊天内容，按 Enter 发送" maxlength="500" autocomplete="off">
        <button class="send-btn" id="btn-send">发送</button>
      </div>
    </div>

    <!-- Sidebar -->
    <div class="sidebar">
      <!-- Players -->
      <div class="side-card">
        <h3>玩家列表</h3>
        <div class="player-list" id="player-list"></div>
      </div>

      <!-- Votes (shown during voting) -->
      <div class="side-card" id="vote-panel" style="display:none;">
        <h3>投票</h3>
        <div class="voting-grid" id="voting-grid"></div>
        <div class="votes-progress" id="votes-progress"></div>
      </div>

      <!-- Elimination notice -->
      <div class="side-card" id="elim-panel" style="display:none;">
        <div class="elim-banner" id="elim-banner">X号已被淘汰</div>
      </div>
    </div>
  </div>
</div>

<!-- ═══════════════ OVERLAY: VOTING LOCK ═══════════════ -->
<div id="lock-overlay" class="lock-overlay" style="display:none;">
  <div class="lock-msg" id="lock-msg">投票进行中...</div>
</div>

<!-- ═══════════════ SCREEN: END ═══════════════ -->
<div id="screen-end" class="screen end-screen">
  <div class="end-title" id="end-title">游戏结束</div>
  <div class="end-subtitle" id="end-subtitle"></div>

  <div class="identities-grid" id="identities-grid"></div>

  <div class="chat-log-viewer">
    <h3>完整聊天记录</h3>
    <div id="end-chat-log"></div>
  </div>

  <div class="end-actions">
    <button class="btn btn-primary" id="btn-restart">再来一局</button>
    <button class="btn btn-secondary" id="btn-back-lobby">返回大厅</button>
    <button class="btn btn-secondary" id="btn-camera-verify" style="display:none;">开启摄像头</button>
  </div>
  <div id="camera-preview-area" style="display:none;margin-top:16px;">
    <video id="camera-video" autoplay muted playsinline style="max-width:240px;border-radius:8px;border:1px solid var(--border);"></video>
    <div style="font-size:0.8rem;color:var(--muted);margin-top:6px;text-align:center;">你的摄像头 — 结算阶段可见</div>
  </div>
</div>

<!-- ═══════════════ TOAST ═══════════════ -->
<div id="toast" class="toast" style="display:none;"></div>

<!-- ═══════════════ CONFIRM MODAL ═══════════════ -->
<div id="confirm-modal" class="lock-overlay" style="display:none;z-index:100;">
  <div style="background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:28px;max-width:360px;text-align:center;">
    <div id="confirm-msg" style="margin-bottom:20px;font-size:1rem;">确认执行此操作？</div>
    <div style="display:flex;gap:12px;justify-content:center;">
      <button class="btn btn-secondary" id="confirm-cancel">取消</button>
      <button class="btn btn-primary" id="confirm-ok">确认</button>
    </div>
  </div>
</div>

<script>
// ═══════════════════════════════════════════════════════════════════
//  STATE
// ═══════════════════════════════════════════════════════════════════
const STATE = {
  screen: 'lobby',      // lobby | waiting | game | end
  ws: null,
  _pending: [],         // messages queued before WS open
  mySeat: null,
  roomId: null,
  isHost: false,
  isSpectator: false,
  phase: 'waiting',
  round: 1,
  players: [],          // [{seat, is_alive, is_you, is_host, is_ai}]
  chatLog: [],
  chatSecLeft: 0,
  voteSecLeft: 0,
  votesCast: new Set(),
  votesReceived: {},   // seat -> count
  eliminated: null,
  winner: null,
  identities: {},
  wsConnected: false,
  typingSeats: new Set(),
  votedSeats: [],
};

let timerInterval = null;

// ═══════════════════════════════════════════════════════════════════
//  WEBSOCKET
// ═══════════════════════════════════════════════════════════════════
function wsConnect() {
  const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
  const ws = new WebSocket(`${proto}//${location.host}/ws`);
  STATE.ws = ws;

  ws.onopen = () => {
    STATE.wsConnected = true;
    // Flush any messages queued before connection opened
    STATE._pending.forEach(msg => STATE.ws.send(JSON.stringify(msg)));
    STATE._pending = [];
  };

  ws.onmessage = (evt) => {
    const msg = JSON.parse(evt.data);
    handleMsg(msg);
  };

  ws.onclose = () => {
    STATE.wsConnected = false;
    setTimeout(() => { if (STATE.screen !== 'lobby') wsConnect(); }, 2000);
  };

  ws.onerror = () => { ws.close(); };
}

function wsSend(obj) {
  if (STATE.ws && STATE.ws.readyState === WebSocket.OPEN) {
    STATE.ws.send(JSON.stringify(obj));
  } else {
    // Queue for when connection opens
    STATE._pending.push(obj);
  }
}

// ═══════════════════════════════════════════════════════════════════
//  MSG HANDLERS
// ═══════════════════════════════════════════════════════════════════
function handleMsg(msg) {
  switch (msg.type) {
    case 'room_created':
      STATE.roomId = msg.room_id;
      STATE.isHost = true;
      STATE.isSpectator = false;
      showScreen('waiting');
      refreshWaitingRoom();
      toast('房间已创建！', 'success');
      break;

    case 'joined':
      STATE.mySeat = msg.seat;
      STATE.isSpectator = false;
      STATE.isHost = false;
      showScreen('waiting');
      refreshWaitingRoom();
      break;

    case 'spectating':
      STATE.isSpectator = true;
      STATE.isHost = false;
      showScreen('waiting');
      refreshWaitingRoom();
      toast('以围观者身份加入房间', 'success');
      break;

    case 'room_state':
      applyRoomState(msg);
      break;

    case 'game_start':
      showScreen('game');
      STATE.phase = 'chatting';
      STATE.eliminated = null;
      STATE.votesCast.clear();
      STATE.votesReceived = {};
      updatePhaseUI();
      if (!STATE.isSpectator) toast('游戏开始！', 'success');
      else toast('游戏已开始', 'success');
      break;

    case 'chat':
      addChatMsg(msg.seat, msg.text, msg.is_ai);
      break;

    case 'chat_ack':
      // local echo already shown, do nothing extra
      break;

    case 'phase_change':
      STATE.phase = msg.phase;
      if (msg.phase === 'voting') {
        STATE.votesCast.clear();
        STATE.votesReceived = {};
        showVotingUI();
      } else if (msg.phase === 'chatting') {
        STATE.round = msg.round || STATE.round + 1;
        hideVotingUI();
        STATE.phase = 'chatting';
      }
      updatePhaseUI();
      break;

    case 'vote_cast':
      // Another player voted — update progress (viewer doesn't know who for)
      break;

    case 'typing_start': {
      STATE.typingSeats.add(msg.seat);
      renderTypingIndicator();
      break;
    }
    case 'typing_end': {
      STATE.typingSeats.delete(msg.seat);
      renderTypingIndicator();
      break;
    }

    case 'elimination':
      STATE.eliminated = msg.seat;
      STATE.phase = 'eliminating';
      showElimUI(msg.seat);
      updatePhaseUI();
      break;

    case 'game_end':
      STATE.winner = msg.winner;
      STATE.identities = msg.identities;
      STATE.chatLog = msg.chat_log || [];
      showEndScreen();
      break;

    case 'error':
      toast(msg.reason || '发生错误', 'error');
      break;
  }
}

function applyRoomState(msg) {
  STATE.roomId = msg.room_id;
  STATE.phase = msg.phase;
  STATE.round = msg.round_num;
  STATE.players = msg.players || [];
  STATE.chatLog = msg.chat_log || [];
  STATE.chatSecLeft = msg.chat_seconds_left || 0;
  STATE.voteSecLeft = msg.vote_seconds_left || 0;

  // Sync voted seats from server state
  if (msg.voted_seats) {
    STATE.votedSeats = msg.voted_seats;
  }

  // Set my seat if not already set
  const me = STATE.players.find(p => p.is_you);
  if (me) {
    STATE.mySeat = me.seat;
    STATE.isSpectator = false;
  }

  renderChatLog();
  renderPlayerList();
  updatePhaseUI();

  if (msg.phase === 'waiting') {
    showScreen('waiting');
    refreshWaitingRoom();
  } else if (msg.phase === 'chatting') {
    showScreen('game');
    hideVotingUI();
  } else if (msg.phase === 'voting') {
    showScreen('game');
    showVotingUI();
  } else if (msg.phase === 'ended') {
    showScreen('game'); // briefly before end screen
  }
}

// ═══════════════════════════════════════════════════════════════════
//  SCREEN MANAGEMENT
// ═══════════════════════════════════════════════════════════════════
function showScreen(name) {
  STATE.screen = name;
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  const el = document.getElementById(`screen-${name}`);
  if (el) el.classList.add('active');
}

// ═══════════════════════════════════════════════════════════════════
//  LOBBY
// ═══════════════════════════════════════════════════════════════════
function initLobby() {
  // Mode toggle
  ['light', 'standard'].forEach(m => {
    const btn = document.getElementById(`mode-${m}-btn`);
    btn.addEventListener('click', () => {
      document.querySelectorAll('.toggle-btn').forEach(b => b.classList.remove('selected'));
      btn.classList.add('selected');
    });
  });

  // Room visibility toggle
  document.getElementById('cfg-room-visibility').addEventListener('change', e => {
    document.getElementById('pwd-row').style.display = e.target.value === 'private' ? 'flex' : 'none';
  });

  // Create
  document.getElementById('btn-create').addEventListener('click', () => {
    const mode = document.querySelector('.toggle-btn.selected input').value;
    const chatDur = parseInt(document.getElementById('cfg-chat-duration').value);
    const isPublic = document.getElementById('cfg-room-visibility').value === 'public';
    const password = isPublic ? '' : document.getElementById('cfg-password').value;
    const spectatorOn = document.getElementById('cfg-spectator-on').checked;
    const godView = document.getElementById('cfg-god-view').checked;
    const aiInd = document.getElementById('cfg-ai-independent').checked;
    wsSend({
      type: 'create_room',
      mode, chat_duration: chatDur,
      is_public: isPublic, password,
      spectator_on: spectatorOn, god_view: godView,
      ai_independent: aiInd, max_spectators: 50,
    });
  });

  // Join
  document.getElementById('btn-join').addEventListener('click', () => {
    const roomId = document.getElementById('join-room-id').value.trim().toUpperCase();
    const pwd = document.getElementById('join-password').value;
    if (!roomId) { toast('请输入房间号', 'error'); return; }
    wsSend({ type: 'join_room', room_id: roomId, password: pwd });
  });

  // Refresh public rooms
  refreshPublicRooms();
  setInterval(refreshPublicRooms, 5000);
}

async function refreshPublicRooms() {
  try {
    const resp = await fetch('/api/rooms');
    const rooms = await resp.json();
    const list = document.getElementById('public-rooms-list');
    if (!rooms || rooms.length === 0) {
      list.innerHTML = '<div class="waiting-hint">暂无公开房间</div>';
      return;
    }
    list.innerHTML = rooms.map(r => `
      <div class="room-list-item" data-rid="${r.room_id}">
        <div>
          <div class="rl-id">${r.room_id}</div>
          <div class="rl-info">${r.mode === 'standard' ? '9人标准局' : '4人轻量局'}</div>
        </div>
        <div class="rl-players">${r.human_count}/${r.total_seats} 人</div>
      </div>
    `).join('');
    list.querySelectorAll('.room-list-item').forEach(el => {
      el.addEventListener('click', () => {
        document.getElementById('join-room-id').value = el.dataset.rid;
      });
    });
  } catch (e) {}
}

// ═══════════════════════════════════════════════════════════════════
//  WAITING ROOM
// ═══════════════════════════════════════════════════════════════════
function refreshWaitingRoom() {
  document.getElementById('wait-room-id').textContent = STATE.roomId || '------';
  // Determine mode from player count or default to light
  const totalSeats = STATE.players.length >= 7 ? 9 : 4;
  const modeLabel = totalSeats === 9 ? 'standard' : 'light';
  document.getElementById('wait-room-mode').textContent = modeLabel === 'standard' ? '9人标准局' : '4人轻量局';

  const seatGrid = document.getElementById('wait-seats');
  seatGrid.innerHTML = '';
  for (let i = 1; i <= totalSeats; i++) {
    const player = STATE.players.find(p => p.seat === i);
    const div = document.createElement('div');
    div.className = 'seat-slot ' + (player ? 'filled' : 'empty');
    div.innerHTML = `
      <div class="seat-num">${i}号</div>
      <div class="seat-label">${player ? (player.is_ai ? '🤖 AI' : '✅ 已加入') : '空位'}</div>
    `;
    seatGrid.appendChild(div);
  }

  const hint = document.getElementById('wait-hint');
  const minHumans = totalSeats === 9 ? 7 : 3;
  if (STATE.isHost) {
    hint.textContent = STATE.players.length >= minHumans
      ? `${STATE.players.length}/${totalSeats} 人已就位，等待开局...`
      : `等待更多玩家... (${STATE.players.length}/${minHumans} 人即可开局)`;
  } else {
    hint.textContent = STATE.isSpectator ? '围观中，等待游戏开始...' : '等待房主开始游戏...';
  }
}

document.getElementById('btn-copy-room')?.addEventListener('click', () => {
  navigator.clipboard.writeText(STATE.roomId).then(() => toast('房间号已复制', 'success'));
});
document.getElementById('btn-leave-room')?.addEventListener('click', () => {
  wsSend({ type: 'leave' });
  showScreen('lobby');
});

// ═══════════════════════════════════════════════════════════════════
//  GAME SCREEN
// ═══════════════════════════════════════════════════════════════════
function updatePhaseUI() {
  const badge = document.getElementById('phase-badge');
  const timer = document.getElementById('timer-display');
  const roundInfo = document.getElementById('game-round-info');
  const roundLabel = document.getElementById('chat-round-label');
  const chatTimer = document.getElementById('chat-timer');
  const chatInput = document.getElementById('chat-input');
  const sendBtn = document.getElementById('btn-send');
  const specBadge = document.getElementById('spec-badge-area');

  specBadge.style.display = STATE.isSpectator ? 'block' : 'none';

  badge.className = 'phase-badge';

  if (STATE.phase === 'chatting') {
    badge.textContent = '聊天中';
    badge.classList.add('phase-chatting');
    roundInfo.textContent = `第 ${STATE.round} 轮`;
    roundLabel.textContent = `第 ${STATE.round} 轮 · 聊天中`;
    chatInput.disabled = STATE.isSpectator;
    sendBtn.disabled = STATE.isSpectator;
    startTimer('chat');
  } else if (STATE.phase === 'voting') {
    badge.textContent = '投票中';
    badge.classList.add('phase-voting');
    chatInput.disabled = true;
    sendBtn.disabled = true;
    startTimer('vote');
  } else if (STATE.phase === 'eliminating') {
    badge.textContent = '淘汰中';
    badge.classList.add('phase-voting');
    chatInput.disabled = true;
    sendBtn.disabled = true;
  } else if (STATE.phase === 'ended') {
    badge.textContent = '已结束';
    badge.classList.add('phase-ended');
    chatInput.disabled = true;
    sendBtn.disabled = true;
  } else if (STATE.phase === 'waiting') {
    badge.textContent = '等待中';
    badge.classList.add('phase-waiting');
    chatInput.disabled = true;
    sendBtn.disabled = true;
  }
}

function startTimer(type) {
  if (timerInterval) clearInterval(timerInterval);
  timerInterval = setInterval(() => {
    if (type === 'chat') {
      STATE.chatSecLeft = Math.max(0, STATE.chatSecLeft - 1);
      updateTimerDisplay('chat-timer', STATE.chatSecLeft);
      updateTimerDisplay('timer-display', STATE.chatSecLeft);
    } else if (type === 'vote') {
      STATE.voteSecLeft = Math.max(0, STATE.voteSecLeft - 1);
      updateTimerDisplay('chat-timer', STATE.voteSecLeft);
      updateTimerDisplay('timer-display', STATE.voteSecLeft);
      if (STATE.phase === 'voting') updateVotingProgress();
    }
  }, 1000);
}

function updateTimerDisplay(id, sec) {
  const el = document.getElementById(id);
  if (!el) return;
  const m = Math.floor(sec / 60);
  const s = sec % 60;
  el.textContent = `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
  el.classList.toggle('urgent', sec < 60);
}

function renderPlayerList() {
  const list = document.getElementById('player-list');
  if (!list) return;
  const totalSeats = STATE.players.length || 9;
  list.innerHTML = STATE.players.map(p => {
    const isMe = p.is_you;
    const isHost = p.is_host;
    const aliveClass = p.is_alive ? '' : 'dead';
    return `
      <div class="player-row ${aliveClass}">
        <span class="p-num">${p.seat}号</span>
        <span class="p-label">
          ${isMe ? '<span class="p-tag tag-you">你</span>' : ''}
          ${isHost && !isMe ? '<span class="p-tag tag-host">房主</span>' : ''}
        </span>
        <span class="p-tag ${p.is_alive ? 'tag-alive' : 'tag-dead'}">${p.is_alive ? '存活' : '淘汰'}</span>
      </div>
    `;
  }).join('');
}

function renderChatLog() {
  const container = document.getElementById('chat-messages');
  if (!container) return;
  container.innerHTML = '';
  STATE.chatLog.forEach(msg => {
    addChatMsgEl(container, msg.seat, msg.text, false);
  });
  container.scrollTop = container.scrollHeight;
}

function addChatMsg(seat, text, isAI) {
  STATE.chatLog.push({ seat, text, ts: Date.now() });
  const container = document.getElementById('chat-messages');
  if (!container) return;
  addChatMsgEl(container, seat, text, isAI);
  container.scrollTop = container.scrollHeight;
}

function addChatMsgEl(container, seat, text, isAI) {
  const isMe = seat === STATE.mySeat;
  const div = document.createElement('div');
  div.className = 'chat-msg ' + (isMe ? 'my-msg' : 'other-msg') + (isAI ? ' ai-msg' : '');
  div.innerHTML = `
    <span class="seat-tag">${seat}号</span>
    <span class="msg-body">${escHtml(text)}</span>
  `;
  container.appendChild(div);
}

function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function renderTypingIndicator() {
  const container = document.getElementById('chat-messages');
  if (!container) return;
  let existing = document.getElementById('typing-indicator');
  if (!STATE.typingSeats || STATE.typingSeats.size === 0) {
    if (existing) existing.remove();
    return;
  }
  const seats = Array.from(STATE.typingSeats).sort((a, b) => a - b);
  const names = seats.map(s => `${s}号`).join(' ');
  const html = `<span class="seat-tag" style="color:var(--muted)">${names} 正在输入<span class="anim-dots">...</span></span>`;
  if (!existing) {
    existing = document.createElement('div');
    existing.id = 'typing-indicator';
    existing.className = 'typing-indicator';
    container.appendChild(existing);
  }
  existing.innerHTML = html;
  container.scrollTop = container.scrollHeight;
}

// ── Chat input ──────────────────────────────────────────────────
document.getElementById('btn-send')?.addEventListener('click', sendChat);
document.getElementById('chat-input')?.addEventListener('keydown', e => {
  if (e.key === 'Enter') sendChat();
});

function sendChat() {
  const input = document.getElementById('chat-input');
  const text = input.value.trim();
  if (!text || STATE.phase !== 'chatting' || STATE.isSpectator) return;
  wsSend({ type: 'chat', text });
  // Optimistic echo
  addChatMsg(STATE.mySeat, text, false);
  input.value = '';
}

document.getElementById('btn-quit-game')?.addEventListener('click', () => {
  wsSend({ type: 'leave' });
  showScreen('lobby');
  STATE.mySeat = null;
  STATE.roomId = null;
});

// ── Voting UI ────────────────────────────────────────────────────
function showVotingUI() {
  const panel = document.getElementById('vote-panel');
  const grid = document.getElementById('voting-grid');
  panel.style.display = 'block';
  grid.innerHTML = '';

  // Anonymous voting: show all alive targets, no counts
  const aliveTargets = STATE.players.filter(p => p.is_alive && p.seat !== STATE.mySeat);
  aliveTargets.forEach(p => {
    const btn = document.createElement('button');
    btn.className = 'vote-btn';
    btn.dataset.seat = p.seat;
    btn.innerHTML = `${p.seat}号`;
    btn.addEventListener('click', () => castVote(p.seat));
    grid.appendChild(btn);
  });

  updateVotingProgress();

  updateVoteButtonStates();
}

function updateVoteButtonStates() {
  const alreadyVoted = STATE.votesCast.has(STATE.mySeat);
  document.querySelectorAll('.vote-btn').forEach(btn => {
    btn.disabled = alreadyVoted;
  });
}

function castVote(seat) {
  if (STATE.votesCast.has(STATE.mySeat)) return;
  wsSend({ type: 'vote', vote_for: seat });
  STATE.votesCast.add(STATE.mySeat);
  updateVoteButtonStates();
  updateVotingProgress();
}

function updateVotingProgress() {
  const aliveAll = STATE.players.filter(p => p.is_alive);
  const votedCount = STATE.players.filter(p => p.is_alive && STATE.votesCast.has(p.seat)).length;
  // Also include voted_seats from server state
  const serverVotedCount = (STATE.votedSeats || []).length;
  const total = aliveAll.length;
  const progress = document.getElementById('votes-progress');
  progress.innerHTML = `
    <div class="vote-progress-summary">
      <span class="vp-check-icon">✓</span>
      <span>已投票: ${Math.max(votedCount, serverVotedCount)}/${total}</span>
    </div>
    <div class="vote-players-status">
      ${aliveAll.map(p => `
        <div class="vp-player-row ${p.seat === STATE.mySeat ? 'you' : ''}">
          <span class="vp-seat">${p.seat}号${p.seat === STATE.mySeat ? '(你)' : ''}</span>
          <span class="vp-status ${STATE.votesCast.has(p.seat) ? 'voted' : 'pending'}">
            ${STATE.votesCast.has(p.seat) || (STATE.votedSeats && STATE.votedSeats.includes(p.seat)) ? '✓ 已投' : '○ 待投'}
          </span>
        </div>
      `).join('')}
    </div>
  `;
}

function hideVotingUI() {
  document.getElementById('vote-panel').style.display = 'none';
  document.getElementById('votes-progress').innerHTML = '';
}

// ── Elimination UI ───────────────────────────────────────────────
function showElimUI(seat) {
  const panel = document.getElementById('elim-panel');
  const banner = document.getElementById('elim-banner');
  panel.style.display = 'block';
  banner.textContent = `${seat}号已被淘汰`;
  // Also update player list
  const pRow = STATE.players.find(p => p.seat === seat);
  if (pRow) pRow.is_alive = false;
  renderPlayerList();

  setTimeout(() => {
    panel.style.display = 'none';
  }, 3000);
}

// ═══════════════════════════════════════════════════════════════════
//  END SCREEN
// ═══════════════════════════════════════════════════════════════════
function showEndScreen() {
  showScreen('end');
  const title = document.getElementById('end-title');
  const subtitle = document.getElementById('end-subtitle');

  if (STATE.winner === 'human') {
    title.textContent = '🏆 人类胜利！';
    title.className = 'end-title human-win';
    subtitle.textContent = '所有 AI 已被成功鉴别并淘汰';
  } else {
    title.textContent = '🤖 AI 胜利！';
    title.className = 'end-title ai-win';
    subtitle.textContent = 'AI 成功伪装到了最后';
  }

  // Identities
  const grid = document.getElementById('identities-grid');
  const totalSeats = Object.keys(STATE.identities).length;
  grid.innerHTML = Array.from({length: Math.max(totalSeats, 9)}, (_, i) => i + 1).map(seat => {
    const identity = STATE.identities[seat] || (STATE.players.find(p => p.seat === seat && !p.is_alive && !STATE.identities[seat]) ? '淘汰' : '—');
    const isHuman = identity === '真人';
    const isAI = identity === 'AI';
    const cls = isHuman ? 'human' : isAI ? 'ai' : '';
    return `
      <div class="identity-card ${cls}">
        <div class="i-num">${seat}号</div>
        <div class="i-type">${identity === '真人' ? '👤 真人' : identity === 'AI' ? '🤖 AI' : '—'}</div>
      </div>
    `;
  }).join('');

  // Chat log
  const logEl = document.getElementById('end-chat-log');
  logEl.innerHTML = STATE.chatLog.map(m => `
    <div class="log-entry">
      <span class="l-seat">${m.seat}号：</span>
      <span class="l-text">${escHtml(m.text)}</span>
    </div>
  `).join('');

  // Show camera button at end screen (post-game verification)
  const camBtn = document.getElementById('btn-camera-verify');
  const camArea = document.getElementById('camera-preview-area');
  camBtn.style.display = 'inline-flex';

  let cameraStream = null;
  camBtn.addEventListener('click', async () => {
    if (cameraStream) {
      cameraStream.getTracks().forEach(t => t.stop());
      cameraStream = null;
      camArea.style.display = 'none';
      camBtn.textContent = '开启摄像头';
      return;
    }
    try {
      cameraStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
      const video = document.getElementById('camera-video');
      video.srcObject = cameraStream;
      camArea.style.display = 'block';
      camBtn.textContent = '关闭摄像头';
    } catch (e) {
      toast('无法访问摄像头：请在浏览器设置中允许摄像头权限', 'error');
    }
  });
}

document.getElementById('btn-restart')?.addEventListener('click', () => {
  wsSend({ type: 'restart' });
  showScreen('lobby');
});
document.getElementById('btn-back-lobby')?.addEventListener('click', () => {
  wsSend({ type: 'leave' });
  STATE.mySeat = null;
  STATE.roomId = null;
  showScreen('lobby');
});

// ═══════════════════════════════════════════════════════════════════
//  TOAST
// ═══════════════════════════════════════════════════════════════════
function toast(msg, type = '') {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = 'toast' + (type ? ` ${type}` : '');
  el.style.display = 'block';
  setTimeout(() => { el.style.display = 'none'; }, 3000);
}

// ═══════════════════════════════════════════════════════════════════
//  CONFIRM MODAL
// ═══════════════════════════════════════════════════════════════════
let _confirmCB = null;
function confirm(msg) {
  return new Promise(resolve => {
    document.getElementById('confirm-msg').textContent = msg;
    document.getElementById('confirm-modal').style.display = 'flex';
    _confirmCB = resolve;
  });
}
document.getElementById('confirm-cancel')?.addEventListener('click', () => {
  document.getElementById('confirm-modal').style.display = 'none';
  if (_confirmCB) _confirmCB(false);
  _confirmCB = null;
});
document.getElementById('confirm-ok')?.addEventListener('click', () => {
  document.getElementById('confirm-modal').style.display = 'none';
  if (_confirmCB) _confirmCB(true);
  _confirmCB = null;
});

// ═══════════════════════════════════════════════════════════════════
//  INIT
// ═══════════════════════════════════════════════════════════════════
document.addEventListener('DOMContentLoaded', () => {
  initLobby();
  wsConnect();
});
</script>
